# CI do Sistema Cronograma CTCEA — roda o mesmo que um desenvolvedor roda na
# máquina dele, na mesma ordem: lint, testes, build.
#
# Existe porque os checks anteriores (Vercel e GitGuardian) conferem build e
# segredos, mas não a suíte de testes: um PR podia entrar com teste quebrado
# sem ninguém ver.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite reexecutar à mão, pela aba Actions.
  #
  # Sem isto, a única forma de rodar o CI de novo é empurrar código — e houve
  # um caso em que o `pull_request` não disparou na abertura do PR, deixando 12
  # commits sem nenhuma execução. As saídas que sobravam eram todas ruins:
  # commit vazio, ou fechar e reabrir o PR.
  workflow_dispatch:

# Um push novo cancela a execução anterior da mesma branch — não faz sentido
# esperar CI de um commit que já foi substituído.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` dispara o postinstall (`prisma generate`), que não precisa de
      # DATABASE_URL — ver o comentário em prisma.config.ts.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      # O build é também o typecheck: `tsc --noEmit` sozinho falha porque
      # `PageProps`/`LayoutProps` são tipos que o próprio `next build` gera.
      #
      # Os valores abaixo são descartáveis e servem só para o build completar —
      # nada é implantado a partir daqui, e nenhuma conexão de banco é aberta
      # (as páginas são todas dinâmicas, renderizadas sob demanda). Os segredos
      # de verdade vivem na Vercel.
      - name: Build (inclui typecheck)
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_valor_descartavel_de_ci

  # Teste de navegador: sobe o sistema construído de verdade contra um Postgres
  # descartável, com o Clerk trocado por um falso (ver next.config.ts). Job
  # separado para não atrasar o feedback de lint/testes — mas é ele que pega o
  # que só aparece com a página aberta (um erro 500 de Server Action chegou à
  # produção justamente por isso).
  navegador:
    name: Teste de navegador
    # Fixo no 24.04: o `ubuntu-latest` já aponta para o 26.04, que esta versão do
    # Playwright não suporta (não instala as dependências do Chromium).
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: cronograma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:teste@127.0.0.1:5432/cronograma

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Aplicar as migrations no banco descartável
        run: npx prisma migrate deploy

      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium

      - name: Teste de navegador
        run: npm run test:e2e

      # Só em falha: o relatório traz screenshot e trace de cada teste que quebrou.
      - name: Guardar o relatório de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
